# ==============================================
# x-llamaindex Production Docker Compose Override
# ==============================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      - DEBUG=false
      - LOG_LEVEL=WARNING
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
